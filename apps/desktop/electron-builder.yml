appId: com.orchestra.app
productName: Orchestra
artifactName: Orchestra-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!experiments/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # node-gyp drops symlinks here pointing at the toolchain's python3 (e.g. inside
  # Xcode.app). asarUnpack pulls node-pty in wholesale, and electron-builder
  # packages unpacked files by hard-linking them — which fails EPERM on a symlink
  # into a SIP-protected path. They're build-time shims with no runtime use.
  - '!**/node_gyp_bins/**'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
extraResources:
  # The phone client. `bun run build` in apps/web writes a static export to
  # apps/web/out; the packaged app serves it from process.resourcesPath/web
  # (dev reads ../web/out directly — see local-server/index.ts defaultWebRoot).
  # Build the web app BEFORE electron-builder or this directory is empty.
  - from: ../web/out
    to: web
  - from: voice-sidecar
    to: voice-sidecar
    filter:
      - '**/*.py'
      - 'pyproject.toml'
      - 'setup.sh'
      - '!tests/**'
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSMicrophoneUsageDescription: Orchestra listens for the wake word to invoke voice commands.
    # The desktop serves the phone; App Nap throttles a backgrounded app's timers
    # and sockets, which would stall the local server and hold phone commands
    # until the window was touched. Belt to the bridge's prevent-app-suspension
    # braces.
    - LSAppNapIsDisabled: true
  notarize: true
npmRebuild: true
publish:
  provider: github
  # No owner/repo here: electron-builder takes them from the `repository`
  # field in apps/desktop/package.json (a CI checkout has no usable git
  # origin to fall back on). A fork changes that one field and its builds
  # auto-update from the fork's own GitHub Releases; the release workflow
  # likewise publishes to `${{ github.repository }}`.
  #
  # Public repo: electron-updater reads the public releases feed, no token
  # needed. If your fork is private, set `private: true` and bake a read-only
  # token in at build time (MAIN_VITE_UPDATER_GH_TOKEN, see updater.ts).
  private: false
