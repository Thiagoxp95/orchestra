appId: com.orchestra.app
productName: Orchestra
artifactName: Orchestra-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # node-gyp drops symlinks here pointing at the toolchain's python3 (e.g. inside
  # Xcode.app). asarUnpack pulls node-pty in wholesale, and electron-builder
  # packages unpacked files by hard-linking them — which fails EPERM on a symlink
  # into a SIP-protected path. They're build-time shims with no runtime use.
  - '!**/node_gyp_bins/**'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
extraResources:
  - from: voice-sidecar
    to: voice-sidecar
    filter:
      - '**/*.py'
      - 'pyproject.toml'
      - 'setup.sh'
      - '!tests/**'
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSMicrophoneUsageDescription: Orchestra listens for the wake word to invoke voice commands.
    # The desktop is the hub the phone drives through Convex; App Nap throttles a
    # backgrounded app's timers and sockets, which held phone commands until the
    # window was touched (2026-08-16). Belt to the bridge's prevent-app-suspension
    # braces.
    - LSAppNapIsDisabled: true
  notarize: true
npmRebuild: true
publish:
  provider: github
  owner: Thiagoxp95
  repo: orchestra
  # Repo is private: the updater authenticates via the GitHub API using a token
  # baked in at build time (MAIN_VITE_UPDATER_GH_TOKEN). Without this, electron-
  # updater falls back to the public releases.atom feed, which 404s for private
  # repos. The token is NOT stored here — it is injected at runtime in updater.ts.
  private: true
